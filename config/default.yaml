# Chess ML Framework Configuration

# Hardware Settings
hardware:
  device: auto  # auto, cpu, mps, cuda
  num_workers: 4

# External Engine Paths
engines:
  stockfish:
    path: /opt/homebrew/bin/stockfish
    default_depth: 15
    default_multipv: 4  # Number of moves to analyze per position (reduced from 5)

# Data Paths
paths:
  openings: config/openings.json
  database: data/chess_dataset.db
  checkpoints: checkpoints/

# Model Configuration
model:
  # Backbone type: convnet, resnet, square_transformer, piece_transformer, gcn, gat
  backbone: resnet
  
  # Output head: policy, value, dual
  head: dual
  
  # CNN-specific settings
  cnn:
    num_blocks: 10  # For ResNet: 6, 10, or 20
    channels: 256
  
  # Transformer-specific settings
  transformer:
    embed_dim: 256
    num_heads: 8
    num_layers: 6
    dropout: 0.1
  
  # GNN-specific settings
  gnn:
    hidden_dim: 256
    num_layers: 6
    edge_type: hybrid  # static, dynamic, hybrid
    heads: 4  # For GAT only

# Training Configuration
training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  lr_scheduler:
    type: cosine  # step, cosine, none
    step_size: 10
    gamma: 0.1

# Data Generation Configuration
data_generation:
  num_games: 1000
  max_moves_per_game: 200
  temperature: 1.0  # For move sampling
  save_every: 5  # Save to DB every N games
  # Storage optimization settings (reduces DB size by ~50%)
  skip_first_ply: 8  # Skip opening theory positions
  sample_rate: 2  # Store every Nth position (1=all, 2=every other)
  # Asymmetric depth for game variety (prevents 95% draws)
  white_depth: 16  # Higher depth = stronger play
  black_depth: 12  # Lower depth = weaker, creates decisive games
  # Draw adjudication (eliminates '*' results)
  adjudication_threshold: 10  # Centipawns threshold
  adjudication_moves: 10  # Consecutive moves within threshold

