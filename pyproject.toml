[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchless-chess"
version = "0.1.0"
description = "Chess Engine based on ML Models without search trees."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "chess",
    "pydantic-settings",
    "pyyaml",
    "numpy",
    "scipy",
    "tqdm",
    "matplotlib",
    "pandas",
    "pyarrow",
    "torch_geometric",
    "duckdb",
    "flask",
    "pydantic",
    "reportlab",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["src"]
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
